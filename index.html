<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121813">
  <title>Udon Productivity Tool</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232c3d2f'/%3E%3Cpath d='M9 11c4 0 4 10 7 10s3-10 7-10' fill='none' stroke='%23a8c686' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sign-in -->
  <div id="auth-screen" class="auth-screen" hidden>
    <div class="auth-card">
      <div class="brand-mark big" aria-hidden="true"></div>
      <h1>Udon</h1>
      <p class="muted">Projects, focus time, and revenue in one place.</p>
      <button id="google-btn" class="btn google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <p id="auth-error" class="auth-error" hidden></p>
    </div>
  </div>

  <!-- Loading -->
  <div id="boot" class="boot"><span class="spinner"></span></div>

  <!-- App -->
  <div id="app" class="app" hidden>
    <nav class="sidebar" aria-label="Main">
      <div class="brand"><div class="brand-mark" aria-hidden="true"></div><span>Udon</span></div>
      <a href="#projects" class="nav-item" data-view="projects" data-icon="folder"><span>Projects</span></a>
      <a href="#stopwatch" class="nav-item" data-view="stopwatch" data-icon="timer"><span>Stopwatch</span><i class="live-dot" id="live-dot" hidden></i></a>
      <a href="#heatmap" class="nav-item" data-view="heatmap" data-icon="grid"><span>Heatmap</span></a>
      <a href="#revenue" class="nav-item" data-view="revenue" data-icon="dollar"><span>Revenue</span></a>
      <a href="#history" class="nav-item" data-view="history" data-icon="history"><span>History</span></a>
      <a href="#settings" class="nav-item" data-view="settings" data-icon="sliders"><span>Settings</span></a>
      <div class="sidebar-user" id="sidebar-user"></div>
    </nav>
    <main class="main">
      <section id="view-projects" class="view"></section>
      <section id="view-stopwatch" class="view" hidden></section>
      <section id="view-heatmap" class="view" hidden></section>
      <section id="view-revenue" class="view" hidden></section>
      <section id="view-history" class="view" hidden></section>
      <section id="view-settings" class="view" hidden></section>
    </main>
  </div>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="script.js"></script>
  <script>
    // If the app script fails to load, show a message instead of spinning forever.
    setTimeout(function () {
      var boot = document.getElementById("boot");
      if (boot && !boot.hidden) {
        boot.innerHTML = '<p style="max-width:360px;padding:0 16px;text-align:center;color:#c2bdab">Udon couldn\'t start. Open the browser console (F12) for details, and check that <code>firebase-config.js</code> exports <code>firebaseConfig</code>.</p>';
      }
    }, 12000);
  </script>
</body>
</html>
